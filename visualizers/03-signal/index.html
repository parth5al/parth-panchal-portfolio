<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal — Visualizer 03</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #888; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>

<!--
  Signal — a neon light-painting tunnel streams past while a backlit figure walks away from us
  toward the doorway at its end, dissolving into the light. Signal waves pulse out of the doorway and ripple the streaks; digital
  glitch bursts tear the picture. One full-screen shader; all motion uses whole-number cycles
  of the 30s loop, so frame 900 lands exactly on frame 0.

  URL modes: (none) live · ?t=12 freeze · ?still=0,10&w=1920 · ?render=1&w=1920&mbps=40,14&name=a.mp4,b.mp4
  Tuning: &grain=0.07 &grainsize=1 &ss=2
-->
<script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uGrain;
uniform float uGrainPx;
out vec4 outColor;

#define TAU 6.28318530718
#define LOOP 30.0
#define F 0.8          // focal length (screen uv is normalised by height)
#define WX 1.6         // tunnel half-width
#define WY 1.3         // tunnel half-height (floor at -WY)
#define ZP 5.5         // depth of the glowing doorway
#define DL 0.050       // spacing between light streaks
#define CA 0.19        // maze cell, across the streaks
#define CZ 0.34        // maze cell, along the tunnel
#define PCELLS 98.0    // walls scroll exactly 98 cells per loop (~1.1 m/s, so his planted feet move with the floor)

float PH, PULSE, G, CHUNK;

float hash11(float p){ p = fract(p*.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
mat3 rotY3(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
vec2 rot(vec2 p, float a){ float c = cos(a), s = sin(a); return vec2(c*p.x - s*p.y, s*p.x + c*p.y); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0)/k; return min(a, b) - h*h*k*0.25; }

// light-painting colours
vec3 palette(float h, float wall){
  if (wall > 1.5 && wall < 2.5) h = h < 0.55 ? 0.05 : h;     // ceiling leans orange, like the reference
  h = fract(h);
  if (h < 0.24) return vec3(1.00, 0.40, 0.06);  // orange
  if (h < 0.44) return vec3(0.20, 1.00, 0.30);  // green
  if (h < 0.62) return vec3(0.22, 0.42, 1.00);  // blue
  if (h < 0.74) return vec3(1.00, 0.86, 0.50);  // warm white
  if (h < 0.88) return vec3(0.68, 0.32, 1.00);  // violet
  return vec3(1.00, 0.18, 0.10);                // red
}

// ---------- the walking figure: a 3D walk cycle, seen from behind, projected with real perspective ----------
// He walks away from us down the tunnel, shrinking as he goes, and dissolves into the doorway light;
// then the next walk materialises near the camera in a glitch. Two walks per loop (hand-offs at 10.5s and 25.5s).
vec2 J[18];      // joints on screen (uv)
float JS[18];    // perspective scale at each joint (uv per metre)
vec3 FIGPOS; mat3 FIGROT;
float ZB, WALKU, DISSOLVE, MATER, FIGR;
vec2 FIGC;
void putJ(int i, vec3 local){ vec3 w = FIGPOS + FIGROT*local; J[i] = w.xy*F/w.z; JS[i] = F/w.z; }

void setupFigure(){
  WALKU = fract(uTime/15.0 + 0.3);
  ZB = mix(2.4, ZP - 0.12, WALKU);                     // recedes ~3m per walk
  DISSOLVE = smoothstep(0.90, 0.985, WALKU);            // melts into the light at the end
  MATER = 1.0 - smoothstep(0.0, 0.05, WALKU);           // glitches into being at the start
  float ph = PH*26.0;                                   // 26 strides per loop
  float sway = 0.025*sin(ph);
  FIGPOS = vec3(0.0, -WY, ZB);
  FIGROT = rotY3(0.28 + 0.06*sin(PH));                  // mostly from behind, a little turned so the stride shows
  vec3 knee[2], ankle[2], toe[2];
  float ext[2];
  for (int i = 0; i < 2; i++){
    float lp = ph + (i == 0 ? 0.0 : 3.14159265);
    float th = 0.42*sin(lp);                            // thigh swing (+ = forward, away from us)
    float kb = 0.10 + 0.95*pow(max(0.0, cos(lp + 0.6)), 3.0);   // knee bends during the swing
    vec3 td = vec3(0.0, -cos(th), sin(th));
    vec3 sd = vec3(0.0, -cos(th - kb), sin(th - kb));
    ext[i] = 0.46*cos(th) + 0.44*cos(th - kb);
    knee[i] = td*0.46; ankle[i] = knee[i] + sd*0.44;
    toe[i] = ankle[i] + vec3(0.0, -0.02, 0.16);
  }
  float hipY = 0.075 + max(ext[0], ext[1]);              // stance foot stays on the floor
  float py = 0.12*sin(ph), sy = -0.18*sin(ph);
  vec3 pel = vec3(sway, hipY, 0.0);
  for (int i = 0; i < 2; i++){
    float s = i == 0 ? -1.0 : 1.0;
    vec3 h3 = pel + vec3(s*0.10*cos(py), 0.0, -s*0.10*sin(py));
    putJ(i*4+0, h3); putJ(i*4+1, h3 + knee[i]); putJ(i*4+2, h3 + ankle[i]); putJ(i*4+3, h3 + toe[i]);
  }
  putJ(8, pel + vec3(0.0, 0.06, 0.0));
  putJ(9, pel + vec3(-sway*0.4, 0.42, -0.03));
  putJ(10, pel + vec3(-sway*0.5, 0.60, -0.03));
  putJ(11, pel + vec3(-sway*0.5, 0.735, -0.02));
  for (int i = 0; i < 2; i++){
    float s = i == 0 ? -1.0 : 1.0;
    float lp = ph + (i == 0 ? 0.0 : 3.14159265);
    vec3 sh = pel + vec3(s*0.21*cos(sy), 0.53, -s*0.21*sin(sy));
    float as = -0.40*sin(lp);                           // arm swings against the leg on its side
    float eb = 0.25 + 0.35*max(0.0, -sin(lp));
    vec3 el = sh + normalize(vec3(s*0.06, -cos(as), sin(as)))*0.29;
    vec3 wr = el + normalize(vec3(s*0.02, -cos(as + eb), sin(as + eb)))*0.26;
    putJ(12 + i*3, sh); putJ(13 + i*3, el); putJ(14 + i*3, wr);
  }
  FIGC = J[8]; FIGR = 1.25*F/ZB;                        // screen-space bounds
}
float seg(vec2 p, vec2 a, vec2 b, float ra, float rb){
  vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba)/dot(ba, ba), 0.0, 1.0);
  return length(pa - ba*h) - mix(ra, rb, h);
}
float segJ(vec2 p, int a, int b, float ra, float rb){ return seg(p, J[a], J[b], ra*JS[a], rb*JS[b]); }
// signed distance to the silhouette, in screen uv
float figure(vec2 p){
  if (length(p - FIGC) > FIGR) return 0.5;
  float d = segJ(p, 8, 9, 0.145, 0.18);
  d = smin(d, segJ(p, 12, 15, 0.072, 0.072), 0.09*JS[9]);  // shoulders
  d = smin(d, segJ(p, 9, 10, 0.115, 0.06), 0.04*JS[9]);
  d = smin(d, length((p - J[11])*vec2(1.0, 0.86)) - 0.112*JS[11], 0.03*JS[11]);   // head
  for (int i = 0; i < 2; i++){
    d = smin(d, segJ(p, i*4+0, i*4+1, 0.105, 0.072), 0.05*JS[8]);
    d = smin(d, segJ(p, i*4+1, i*4+2, 0.070, 0.050), 0.03*JS[8]);
    d = smin(d, segJ(p, i*4+2, i*4+3, 0.050, 0.038), 0.02*JS[8]);
    d = smin(d, segJ(p, 12+i*3, 13+i*3, 0.064, 0.052), 0.03*JS[8]);
    d = smin(d, segJ(p, 13+i*3, 14+i*3, 0.050, 0.040), 0.02*JS[8]);
    d = smin(d, length(p - J[14+i*3]) - 0.052*JS[14+i*3], 0.02*JS[8]);
  }
  return d;
}

// ---------- the scene for one screen position ----------
vec3 scene(vec2 uv){
  vec2 q = rot(uv, 0.025*sin(PH));
  vec3 rd = vec3(q, F);
  float tx = WX/max(abs(rd.x), 1e-5), ty = WY/max(abs(rd.y), 1e-5);
  float t = min(tx, ty);
  float z = t*F;
  vec3 col;

  // signal waves: packets that leave the doorway (and the figure) and travel out toward us
  float wave = 0.0, ring = 0.0;
  for (int i = 0; i < 3; i++){
    float ph = fract(uTime*4.0/LOOP + float(i)/3.0);
    float zc = mix(ZP - 0.2, 1.0, ph);
    float fade = (1.0 - ph) * smoothstep(0.0, 0.08, ph);
    float env = exp(-pow((z - zc)/0.28, 2.0)) * fade;
    wave += env * sin(z*11.0 - PH*60.0 + float(i)*2.1);
    ring += exp(-pow((z - zc)/0.035, 2.0)) * fade;
  }

  // portal glow, measured in screen space from the doorway rectangle
  vec2 ph2 = vec2(WX, WY)*F/ZP;
  vec2 dq = abs(q) - ph2;
  float dBox = length(max(dq, 0.0)) + min(max(dq.x, dq.y), 0.0);

  if (z >= ZP){
    // the doorway: blown-out white light with a faint colour wash and signal static
    float stat = hash12(vec2(floor(q.y*140.0), CHUNK)) * 0.25 * (0.3 + G);
    col = vec3(1.0, 0.93, 0.82)*2.6;
    col += vec3(1.0, 0.45, 0.75)*0.8*smoothstep(0.0, -ph2.x, q.x) + vec3(0.4, 0.75, 1.0)*0.8*smoothstep(0.0, ph2.x, q.x);
    col += stat;
  } else {
    bool side = tx < ty;
    float a = side ? rd.y*t : rd.x*t;                   // position across the wall
    float wall = side ? (rd.x > 0.0 ? 0.0 : 1.0) : (rd.y > 0.0 ? 2.0 : 3.0);
    float zs = z + uTime*PCELLS*CZ/LOOP;                // the walls stream toward us
    float A = a + 0.028*wave;
    float li = floor(A/DL);
    float fa = fract(A/DL) - 0.5;
    float px = fwidth(A/DL);
    float lh = hash12(vec2(li, wall*17.0));
    float shift = G > 0.0 ? floor(hash11(CHUNK + 4.0)*6.0)/6.0 : 0.0;   // glitch bursts reshuffle colours
    vec3 lc = palette(lh + shift, wall);
    float core = 1.0 - smoothstep(0.13, 0.13 + px*1.2, abs(fa));
    float glow = exp(-abs(fa)*8.0)*0.40;
    float lineI = mix(core*1.4 + glow, 0.42, smoothstep(0.35, 0.9, px));
    // circuit-maze gaps carved through the streaks
    vec2 cell = vec2(floor(A/CA), mod(floor(zs/CZ), PCELLS));
    vec2 cf = vec2(fract(A/CA), fract(zs/CZ));
    float hPath = step(hash13(vec3(cell, wall + 1.0)), 0.42) * step(cf.x, 0.30);
    float vPath = step(hash13(vec3(cell, wall + 7.0)), 0.40) * step(cf.y, 0.24);
    float dash = step(hash13(vec3(li, mod(floor(zs/(CZ/3.0)), PCELLS*3.0), wall)), 0.10);
    float mask = (1.0 - max(hPath, vPath)) * (1.0 - dash);
    // lines grow whiter as they near the light, and flare as a wave passes
    lc = mix(lc, vec3(1.0, 0.95, 0.85), smoothstep(ZP - 1.6, ZP, z)*0.55);
    col = lc * lineI * mask * (0.85 + 0.25*PULSE) * (1.0 + 1.2*abs(wave));
    // bright light-painted frames near the doorway + the travelling signal rings
    float frames = exp(-pow((z - (ZP - 0.06))/0.02, 2.0))*1.8 + exp(-pow((z - (ZP - 0.55))/0.02, 2.0))*0.9;
    col += vec3(1.0, 0.95, 0.9)*frames + vec3(0.75, 0.95, 1.0)*ring*1.6;

    // the figure's shadow, thrown down the floor toward us by the doorway light
    if (wall == 3.0 && z < ZB){
      vec3 P = vec3(rd.x*t, -WY, z), Lp = vec3(0.0, 0.25, ZP + 1.2);
      vec3 S = mix(P, Lp, (ZB - P.z)/(Lp.z - P.z));
      float blur = (0.02 + 0.06*(ZB - z)) * F/ZB;
      float sh = 1.0 - smoothstep(-blur, blur, figure(S.xy*F/ZB));
      col *= 1.0 - 0.85*sh*(1.0 - DISSOLVE)*(1.0 - MATER);
    }
  }
  // halation from the doorway spilling over the tunnel
  col += vec3(1.0, 0.85, 0.7) * exp(-max(dBox, 0.0)*14.0) * 0.35 * step(0.0, dBox);

  // silhouette: pure black, with light bleeding over its edges
  float slice = floor(q.y*110.0);
  float fr = floor(uTime*30.0 + 0.5);
  vec2 fq = q + vec2((hash12(vec2(slice, fr + 3.0)) - 0.5)*0.08*MATER, 0.0);   // materialising: torn slices
  float dF = figure(fq);
  float m = 1.0 - smoothstep(-1.0/uRes.y, 1.0/uRes.y, dF);
  float hs = hash12(vec2(slice, fr));
  m *= step(DISSOLVE, hs) * step(MATER*0.95, hs);                 // scanline dissolve in and out
  float rimW = 0.004*F/ZB;
  vec3 bleed = vec3(1.0, 0.88, 0.75) * exp(min(dF, 0.0)/rimW) * (1.2 + 3.0*DISSOLVE) * step(dBox, 0.0);
  col = mix(col, bleed, m);
  return col;
}

void main(){
  PH = TAU * uTime / LOOP;
  PULSE = 0.5 - 0.5*cos(PH*8.0);
  float fr = floor(uTime*30.0 + 0.5);
  CHUNK = floor(fr/4.0);                                // glitch decisions change every 4 frames
  float hb = hash11(CHUNK*1.37 + 0.5);
  G = hb > 0.84 ? (hb - 0.84)/0.16 : 0.0;               // ~16% of the time a glitch burst is on
  if (CHUNK < 1.0 || CHUNK > 223.0) G = 0.0;            // keep the loop point clean
  setupFigure();
  float sinceSwap = min(WALKU, 1.0 - WALKU) * 15.0;
  if (sinceSwap < 0.3) G = max(G, 0.85);                 // a hard glitch hides each hand-off

  vec2 fc = gl_FragCoord.xy;
  vec2 uv = (fc - 0.5*uRes) / uRes.y;

  // rolling interference band (twice per loop) that wobbles the picture
  float bandY = fract(-uTime*2.0/LOOP)*1.6 - 0.8;
  float band = exp(-pow((uv.y - bandY)/0.05, 2.0));
  uv.x += 0.006*sin(uv.y*90.0 + PH*30.0)*band;

  // glitch bursts: torn slices and corrupted blocks
  if (G > 0.0){
    float rows = mix(6.0, 28.0, hash11(CHUNK + 2.0));
    float bi = floor((uv.y + hash11(CHUNK)) * rows);
    float on = step(0.45, hash12(vec2(bi, CHUNK + 9.0)));
    uv.x += (hash12(vec2(bi, CHUNK)) - 0.5) * 0.16 * G * on;
    vec2 bc = floor(uv*vec2(14.0, 8.0));
    if (hash13(vec3(bc, CHUNK)) > 1.0 - 0.10*G) uv += (vec2(hash13(vec3(bc, CHUNK + 1.0)), hash13(vec3(bc, CHUNK + 2.0))) - 0.5)*0.25;
  }

  // RGB split (a touch always, a lot during bursts)
  float s = 0.0015 + 0.012*G + 0.004*band;
  vec3 col;
  col.r = scene(uv + vec2(s, 0.0)).r;
  col.g = scene(uv).g;
  col.b = scene(uv - vec2(s, 0.0)).b;

  // grade
  col = max(col, 0.0) * 0.72;
  col = (col*(2.51*col + 0.03)) / (col*(2.43*col + 0.59) + 0.14);
  col = pow(col, vec3(1.0/2.2));
  vec2 vu = (fc - 0.5*uRes) / uRes.y;
  col *= 1.0 - 0.35*pow(length(vu)*0.9, 2.2);
  col *= 0.94 + 0.06*sin(fc.y*3.14159*0.5);             // faint scanlines
  col += band*0.03;

  // film grain
  vec2 gp = floor(fc / uGrainPx);
  vec2 seed = vec2(mod(fr*73.0, 1031.0), mod(fr*151.0, 977.0));
  float n = hash12(gp + seed) + hash12(gp*1.37 + seed.yx + 19.2) - 1.0;
  vec3 nc = vec3(hash12(gp + seed + 5.1), hash12(gp + seed + 9.7), hash12(gp + seed + 13.3)) - 0.5;
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  float amt = uGrain * (0.65 + 0.7*(1.0 - abs(lum*2.0 - 1.0)));
  amt *= 0.35 + 0.65*smoothstep(0.02, 0.16, lum);
  col += amt * (n*0.85 + nc*0.30);
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script type="module">
const LOOP = 30, FPS = 30, FRAMES = LOOP * FPS;
const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });

const log = (msg) => { console.log(msg); fetch('/log', { method: 'POST', body: String(msg) }).catch(() => {}); };

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const VERT = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
function program(fragSrc) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(pr, 0, 'p');
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}
const prog = program(document.getElementById('frag').textContent);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uGrain = gl.getUniformLocation(prog, 'uGrain');
const uGrainPx = gl.getUniformLocation(prog, 'uGrainPx');
const GRAIN = +(qs.get('grain') ?? 0.07), GRAIN_SIZE = +(qs.get('grainsize') || 1);

function setSize(w, h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
function draw(t, w = canvas.width, h = canvas.height, grainPx = GRAIN_SIZE) {
  gl.useProgram(prog); gl.uniform2f(uRes, w, h); gl.uniform1f(uTime, t);
  gl.uniform1f(uGrain, GRAIN); gl.uniform1f(uGrainPx, grainPx); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Offline rendering: draw at SS× into an offscreen texture, box-downsample on the GPU,
// then readPixels. readPixels is synchronous, so every frame is guaranteed to be the
// one just drawn (copying the visible canvas can hand back a stale frame in a tight loop).
const OUT_W = +(qs.get('w') || 1920), OUT_H = Math.round(OUT_W * 9 / 16), SS = +(qs.get('ss') || 2);
let off = null;
function initOffline() {
  setSize(OUT_W, OUT_H);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, OUT_W * SS, OUT_H * SS);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  // output row r (bottom-up in GL) = image row r from the top, so readPixels comes out top-down
  const down = program(`#version 300 es
precision highp float;
uniform sampler2D src; uniform int ss; uniform int outH; out vec4 o;
void main(){
  ivec2 px = ivec2(gl_FragCoord.xy);
  int sy = outH - 1 - px.y;
  vec3 acc = vec3(0.0);
  for (int y = 0; y < ss; y++) for (int x = 0; x < ss; x++)
    acc += texelFetch(src, ivec2(px.x*ss + x, sy*ss + y), 0).rgb;
  o = vec4(acc / float(ss*ss), 1.0);
}`);
  gl.useProgram(down);
  gl.uniform1i(gl.getUniformLocation(down, 'src'), 0);
  gl.uniform1i(gl.getUniformLocation(down, 'ss'), SS);
  gl.uniform1i(gl.getUniformLocation(down, 'outH'), OUT_H);
  off = { tex, fbo, down, pixels: new Uint8Array(OUT_W * OUT_H * 4) };
}
function renderFrame(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, off.fbo);
  gl.viewport(0, 0, OUT_W * SS, OUT_H * SS);
  draw(t, OUT_W * SS, OUT_H * SS, SS * GRAIN_SIZE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, OUT_W, OUT_H);
  gl.useProgram(off.down);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, off.tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, OUT_W, OUT_H, gl.RGBA, gl.UNSIGNED_BYTE, off.pixels);
  return off.pixels;
}
const checksum = px => { let h = 0; for (let i = 0; i < px.length; i += 4099) h = (h * 31 + px[i]) >>> 0; return h.toString(16); };

async function stills() {
  initOffline();
  const out = document.createElement('canvas'); out.width = OUT_W; out.height = OUT_H;
  const ctx = out.getContext('2d');
  log('renderer: ' + (gl.getExtension('WEBGL_debug_renderer_info') ? gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL) : '?'));
  for (const t of qs.get('still').split(',').map(Number)) {
    const t0 = performance.now();
    ctx.putImageData(new ImageData(new Uint8ClampedArray(renderFrame(t)), OUT_W, OUT_H), 0, 0);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    await fetch('/save?name=' + encodeURIComponent(`still-${t.toFixed(2)}.png`), { method: 'POST', body: blob });
    log(`still t=${t} ${(performance.now() - t0).toFixed(0)}ms`);
  }
  await fetch('/done', { method: 'POST' });
}

// One render pass can feed several encoders, e.g. &mbps=40,14&name=master.mp4,web.mp4
async function renderVideo() {
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.mjs');
  initOffline();
  const rates = (qs.get('mbps') || '24').split(',').map(Number);
  const names = (qs.get('name') || 'signal-30s.mp4').split(',');
  let encErr = null;
  const outs = [];
  for (let j = 0; j < rates.length; j++) {
    let config = null;
    for (const codec of ['avc1.640033', 'avc1.640032', 'avc1.640028', 'avc1.4d0033']) {
      const c = { codec, width: OUT_W, height: OUT_H, bitrate: rates[j] * 1e6, framerate: FPS, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
      if ((await VideoEncoder.isConfigSupported(c)).supported) { config = c; break; }
    }
    if (!config) { log('ERROR: no supported H.264 config'); await fetch('/done', { method: 'POST' }); return; }
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, video: { codec: 'avc', width: OUT_W, height: OUT_H, frameRate: FPS }, fastStart: 'in-memory' });
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; log('ERROR ' + e); } });
    enc.configure(config);
    outs.push({ target, muxer, enc, name: names[j] || `out-${rates[j]}mbps.mp4` });
    log(`encoder ${j}: ${config.codec} ${OUT_W}x${OUT_H} @${rates[j]}Mbps -> ${outs[j].name}`);
  }

  const t0 = performance.now();
  for (let i = 0; i < FRAMES; i++) {
    const px = renderFrame(i / FPS);
    const vf = new VideoFrame(px, { format: 'RGBA', codedWidth: OUT_W, codedHeight: OUT_H, timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    for (const o of outs) o.enc.encode(vf, { keyFrame: i % (FPS * 2) === 0 });
    vf.close();
    while (outs.some(o => o.enc.encodeQueueSize > 6)) await new Promise(r => setTimeout(r, 5));
    if (encErr) break;
    if (i % 150 === 0) log(`frame ${i}/${FRAMES}  ${((performance.now() - t0) / 1000).toFixed(1)}s  checksum ${checksum(px)}`);
  }
  for (const o of outs) {
    await o.enc.flush();
    o.muxer.finalize();
    await fetch('/save?name=' + encodeURIComponent(o.name), { method: 'POST', body: o.target.buffer });
    log(`saved ${o.name} ${(o.target.buffer.byteLength / 1e6).toFixed(1)}MB`);
  }
  log(`done in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
  await fetch('/done', { method: 'POST' });
}

function live() {
  const fixed = qs.has('t') ? +qs.get('t') : null;
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, +(qs.get('dpr') || 1.5));   // ?dpr= caps live resolution (lighter on phones)
    setSize(Math.round(innerWidth * dpr), Math.round(innerHeight * dpr));
  };
  addEventListener('resize', resize); resize();
  const start = performance.now();
  const tick = () => {
    const t = fixed ?? ((performance.now() - start) / 1000) % LOOP;
    draw(t);
    if (qs.has('hud')) hud.textContent = t.toFixed(2) + 's';
    requestAnimationFrame(tick);
  };
  tick();
}

if (qs.has('render')) renderVideo().catch(e => log('ERROR ' + e.stack));
else if (qs.has('still')) stills().catch(e => log('ERROR ' + e.stack));
else live();
</script>
</body>
</html>
