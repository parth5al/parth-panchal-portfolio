<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prism Orb — Visualizer 01</title>
<style>
  html, body { margin: 0; height: 100%; background: #030203; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #8a8090; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>

<!--
  Prism Orb — a sun-like ribbed glass core that keeps budding off small glass orbs.
  They fly out on every axis, spin, warp and stretch (chaos), then get pulled back
  and melt into the ordered core again. Tiny gradient particles stream out behind.
  Everything is driven by one phase PH = 2π·t/30, using whole-number
  multiples only, so frame 900 lands exactly on frame 0 (seamless loop).

  URL modes:
    (none)                live preview, loops every 30s
    ?t=12.5               freeze at a time
    ?still=0,7.5,15&w=1920  render stills and POST them to the local render server
    ?render=1&w=1920      render the full 30s loop to MP4 (WebCodecs) and POST it
    &grain=0.07 &grainsize=1   film grain strength / size (0 turns it off)
-->
<script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uGrain;    // grain strength
uniform float uGrainPx;  // render pixels per grain cell (supersample factor × grain size)
out vec4 outColor;

#define TAU 6.28318530718
#define LOOP 30.0
#define IOR 1.47

float PH;      // loop phase 0..TAU
float PULSE;   // slow breathing swell 0..1
mat3  ORB;     // world -> orb space

mat3 rotX(float a){ float c=cos(a), s=sin(a); return mat3(1.,0.,0., 0.,c,s, 0.,-s,c); }
mat3 rotY(float a){ float c=cos(a), s=sin(a); return mat3(c,0.,-s, 0.,1.,0., s,0.,c); }
mat3 rotZ(float a){ float c=cos(a), s=sin(a); return mat3(c,s,0., -s,c,0., 0.,0.,1.); }

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

// thin-film style iridescence
vec3 film(float x){ return 0.5 + 0.5*cos(TAU*(x + vec3(0.0, 0.33, 0.67))); }

// ---------- studio environment (what glass reflects / refracts) ----------
vec3 softbox(vec3 d, vec3 L, float size, vec3 col){
  float c = dot(d, normalize(L));
  return col * smoothstep(1.0 - size, 1.0 - size*0.25, c);
}

vec3 env(vec3 d, float backAmt){
  d = rotY(0.35*sin(PH)) * d;
  vec3 col = vec3(0.003, 0.0025, 0.005);
  // thin studio strip on the horizon (gives bubbles their horizon line)
  col += vec3(0.50, 0.48, 0.56) * exp(-pow(d.y - 0.02, 2.0) * 420.0) * smoothstep(0.2, -0.5, d.z) * 0.9;
  // faint floor bounce
  col += vec3(0.05, 0.045, 0.06) * smoothstep(0.0, -0.5, d.y) * smoothstep(0.4, -0.4, d.z);
  // key light: white softbox top-left-front
  col += softbox(d, vec3(-0.75, 0.85, 0.55), 0.05, vec3(7.0, 6.8, 7.4));
  // magenta rim from the right
  col += softbox(d, vec3( 1.00, 0.10, -0.25), 0.10, vec3(4.0, 0.35, 1.3));
  // cyan from lower right
  col += softbox(d, vec3( 0.75, -0.65, 0.35), 0.07, vec3(0.2, 1.8, 3.8));
  // violet from the left
  col += softbox(d, vec3(-1.00, -0.25, -0.15), 0.10, vec3(0.9, 0.45, 3.4));
  // warm amber top-back
  col += softbox(d, vec3( 0.25, 0.90, -0.60), 0.06, vec3(3.6, 1.5, 0.4));
  // behind the orb: narrow spectral strip lights + a deep blue fill
  float back = smoothstep(0.0, 0.8, -d.z) * backAmt;
  float az = atan(d.x, -d.z);
  float strips = pow(0.5 + 0.5*sin(az*7.0 + d.y*4.0 + PH*2.0), 10.0);
  col += film(az/TAU*1.5 + d.y*0.6 + PH/TAU) * strips * back * 2.4;
  col += vec3(0.02, 0.04, 0.26) * smoothstep(0.3, 1.0, -d.z) * backAmt * 0.4;
  return col;
}

// ---------- orb distance field ----------
float orbSDF(vec3 p, out float rib){
  vec3 q = ORB * p;
  float r = length(q);
  float hel = q.y > 0.0 ? 1.0 : -1.0;           // top & bottom halves twist opposite ways
  float lat = asin(clamp(q.y / max(r, 1e-4), -1.0, 1.0));
  float lon = atan(q.z, q.x);
  float s = lat*27.0 + hel*lon*2.0 - hel*PH*8.0;  // helical ribs crawling 4 ribs per loop
  rib = abs(sin(0.5*s));                          // rounded crest, sharp valley
  float groove = exp(-q.y*q.y*300.0);             // carved seam between halves
  float A = 0.022 * (1.0 + 0.35*PULSE) * (1.0 - groove);
  float d = r - (1.0 + A*rib) + 0.10*groove;
  d = max(d, abs(q.y) - 0.93 - 0.022*rib);        // slightly flattened, jagged poles
  return d * 0.72;
}
float orbMap(vec3 p){ float r; return orbSDF(p, r); }

vec3 orbNormal(vec3 p){
  const vec2 k = vec2(1.0, -1.0);
  const float e = 0.0012;
  return normalize(k.xyy*orbMap(p + k.xyy*e) + k.yyx*orbMap(p + k.yyx*e) +
                   k.yxy*orbMap(p + k.yxy*e) + k.xxx*orbMap(p + k.xxx*e));
}

vec2 sphereHit(vec3 ro, vec3 rd, vec3 c, float r){
  vec3 oc = ro - c;
  float b = dot(oc, rd);
  float h = b*b - dot(oc, oc) + r*r;
  if (h < 0.0) return vec2(-1.0);
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

// halo colour around the orb, by screen angle
vec3 haloCol(float a){
  a += 0.25*sin(PH);
  vec3 c = vec3(0.0);
  c += vec3(1.00, 0.22, 0.32) * pow(max(cos(a - 0.15), 0.0), 2.0);   // right: hot pink
  c += vec3(0.15, 0.80, 1.00) * pow(max(cos(a + 0.75), 0.0), 3.0);   // lower right: cyan
  c += vec3(0.80, 0.76, 0.95) * pow(max(cos(a - 2.30), 0.0), 4.0);   // top left: white
  c += vec3(0.45, 0.35, 1.00) * pow(max(cos(a - 3.30), 0.0), 2.0);   // left: violet
  c += vec3(1.00, 0.35, 0.65) * pow(max(cos(a + 1.75), 0.0), 3.0);   // bottom: pink
  return c;
}

// ---------- child orbs: born from the core, warp into chaos, pulled back and re-absorbed ----------
// Each child lives k = 1..3 lifetimes per 30s loop. Its path for each lifetime is picked from
// (child, lifetime mod k), so the whole sequence repeats exactly every loop.
#define NC 12
vec4 CC[NC];   // centre, radius
vec4 CV[NC];   // travel direction, stretch amount
vec2 CA[NC];   // distortion amount, visibility envelope
mat3 CR[NC];   // spin

vec4 hash41(float p){ vec4 p4 = fract(vec4(p) * vec4(.1031, .1030, .0973, .1099)); p4 += dot(p4, p4.wzxy + 33.33); return fract((p4.xxyz + p4.yzzw) * p4.zywx); }
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
vec3 sphDir(vec2 r){ float z = r.x*2.0 - 1.0, a = r.y*TAU, s = sqrt(1.0 - z*z); return vec3(s*cos(a), z, s*sin(a)); }
vec3 rotAxis(vec3 v, vec3 k, float a){ return v*cos(a) + cross(k, v)*sin(a) + k*dot(k, v)*(1.0 - cos(a)); }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0)/k; return min(a, b) - h*h*k*0.25; }

vec3 childPath(float u, vec3 d0, vec3 ax, float sweep, float D, float depth){
  vec3 dir = rotAxis(d0, ax, sweep*u);                       // arcs around the core on its own axis
  float reach = D * mix(1.0, 0.62, abs(dir.y));              // keep vertical flights inside the frame
  float b = sin(3.14159265 * pow(clamp(u, 0.0, 1.0), 0.72)); // fast ejection, slower pull-back
  return dir * mix(1.0 - depth, reach, b);
}

void setupChildren(){
  for (int i = 0; i < NC; i++){
    float fi = float(i);
    vec4 h = hash41(fi*17.31 + 3.7);
    float k = 1.0 + floor(h.x*2.999);
    float x = uTime*k/LOOP + h.y;
    float u = fract(x);
    float c = mod(floor(x), k);
    vec4 r1 = hash41(fi*31.7 + c*7.77 + 1.3);
    vec4 r2 = hash41(fi*11.9 + c*5.13 + 8.1);
    vec3 d0 = sphDir(r1.xy);
    vec3 ax = normalize(cross(d0, sphDir(r1.zw)) + 1e-4);
    float sweep = mix(0.9, 2.2, r2.x) * (r2.y > 0.5 ? 1.0 : -1.0);
    float D = mix(1.75, 2.65, r2.w);
    float sFull = mix(0.08, 0.21, r2.z*r2.z) * (k > 2.5 ? 0.75 : 1.0);
    float env = smoothstep(0.0, 0.12, u) * smoothstep(1.0, 0.86, u);
    float s = sFull * mix(0.3, 1.0, env);
    float depth = 0.45 + 1.2*sFull;                           // starts/ends buried deep in the core
    vec3 p  = childPath(u, d0, ax, sweep, D, depth);
    vec3 p2 = childPath(u + 0.01, d0, ax, sweep, D, depth);
    float launch = smoothstep(0.0, 0.1, u) * (1.0 - smoothstep(0.12, 0.3, u));
    CC[i] = vec4(p, s);
    CV[i] = vec4(normalize(p2 - p + 1e-5), 1.1*smoothstep(0.6, 0.96, u) + 0.3*launch);
    CA[i] = vec2(0.24*smoothstep(0.12, 0.7, u), env);
    CR[i] = rotY(PH*(1.0 + mod(fi, 3.0)) + fi) * rotX(PH*2.0 + fi*1.3);
  }
}

float childSDF(vec3 p, int i, float fi){
  vec4 cc = CC[i];
  vec3 q = p - cc.xyz;
  float st = CV[i].w;
  float bound = length(q) - cc.w*(1.5 + 1.3*st);
  if (bound > 0.35) return bound;
  vec3 v = CV[i].xyz;
  q -= v * dot(q, v) * (st/(1.0 + st));          // stretch along travel direction
  q = CR[i] * q;                                  // spin
  vec3 kq = q / cc.w;
  vec3 T = PH*vec3(2.0, 3.0, 1.0) + fi*1.7;
  float n = sin(kq.x*2.6 + T.x)*sin(kq.y*2.3 - T.y)*sin(kq.z*2.9 + T.z)
          + 0.45*sin(kq.x*4.7 + kq.y*3.9 - T.y*2.0)*sin(kq.z*4.1 + T.x);
  return (length(q) - cc.w*(1.0 + CA[i].x*n)) * 0.5;
}

float mapScene(vec3 p, out float rib, out float childW){
  float dO = orbSDF(p, rib);
  float d = dO, dC = 1e9;
  for (int i = 0; i < NC; i++){
    float dc = childSDF(p, i, float(i));
    dC = min(dC, dc);
    d = smin(d, dc, 0.22);                         // gooey budding / merging
  }
  childW = smoothstep(-0.05, 0.05, dO - dC);
  return d;
}
float map(vec3 p){ float r, w; return mapScene(p, r, w); }

vec3 calcNormal(vec3 p){
  const vec2 k = vec2(1.0, -1.0);
  const float e = 0.0012;
  return normalize(k.xyy*map(p + k.xyy*e) + k.yyx*map(p + k.yyx*e) +
                   k.yxy*map(p + k.yxy*e) + k.xxx*map(p + k.xxx*e));
}

// ---------- background: tiny gradient particles streaming out of the core ----------
vec2 rot2(vec2 p, float a){ float c = cos(a), s = sin(a); return vec2(c*p.x - s*p.y, s*p.x + c*p.y); }
vec3 particles(vec2 uv){
  vec3 acc = vec3(0.0);
  float pxUv = 1.0 / uRes.y;
  for (int i = 0; i < 7; i++){
    float fi = float(i);
    float x = uTime*2.0/LOOP + fi/7.0;              // each layer flies outward twice per loop
    float z = fract(x);
    float cyc = mod(floor(x), 2.0);
    float scale = mix(0.22, 2.4, z*z);
    float fade = smoothstep(0.0, 0.3, z) * smoothstep(1.0, 0.7, z);
    vec2 p = rot2(uv, fi*1.7 + 0.12*sin(PH + fi)) / scale;
    vec2 g = p * 30.0;
    vec2 cell = floor(g), f = fract(g) - 0.5;
    vec3 h = hash33(vec3(cell, fi*13.1 + cyc*71.7));
    if (h.z > 0.11) continue;                        // sparse
    vec3 h2 = hash33(vec3(cell.yx, fi*5.3 + cyc*19.1));
    vec2 off = (h.xy - 0.5) * 0.6;
    float cellPx = scale / 30.0 / pxUv;              // cell size in output pixels
    float r = mix(0.05, 0.17, h2.x);
    float blur = mix(0.03, 0.16, z*z);               // near particles go soft, like bokeh
    float rMin = 1.1 / cellPx;                       // never smaller than ~1px (no shimmer)
    float energy = r*r / max(r, rMin) / max(r, rMin);
    r = max(r, rMin); blur = max(blur, 0.8 / cellPx);
    vec2 lp = f - off;
    float d = length(lp);
    float disc = smoothstep(r + blur, max(r - blur*0.5, 0.0), d);
    float gt = clamp(dot(lp/r, normalize(h2.yz - 0.5 + 1e-3))*0.5 + 0.5, 0.0, 1.0);
    vec3 c = mix(film(h2.y*0.6 + 0.55), film(h2.z*0.6 + 0.95), gt);   // two-tone gradient dot
    c = mix(c, vec3(1.0, 0.92, 0.95), 0.15);
    float tw = 0.6 + 0.4*sin(PH*(1.0 + floor(h2.x*3.0)) + h.x*TAU);
    acc += c * disc * fade * tw * energy * mix(0.035, 0.16, z) * smoothstep(0.15, 0.55, length(uv));
  }
  return acc;
}

// ---------- main ----------
void main(){
  PH = TAU * uTime / LOOP;
  PULSE = 0.5 - 0.5*cos(PH*8.0);
  ORB = rotZ(0.62 + 0.12*sin(PH*2.0)) * rotX(0.28*sin(PH)) * rotY(PH);
  setupChildren();

  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 ro = vec3(0.12*sin(PH), 0.22 + 0.05*sin(PH*2.0), 7.6);
  vec3 ta = vec3(0.0, 0.02, 0.0);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
  vec3 vv = cross(uu, ww);
  vec3 rd = normalize(uv.x*uu + uv.y*vv + 2.15*ww);

  // background: near-black, warm ember glow, streaming particles
  float rr = length(uv);
  vec3 col = vec3(0.0015, 0.0012, 0.0016);
  col += vec3(0.034, 0.013, 0.013) * exp(-rr*rr*3.5) * (0.85 + 0.15*PULSE);
  col += particles(uv);

  // --- core + children (one blended surface) ---
  float tHit = 1e9, dMin = 1e9;
  vec3 pMin = vec3(0.0);
  vec2 bs = sphereHit(ro, rd, vec3(0.0), 3.4);
  if (bs.y > 0.0){
    float t = max(bs.x, 0.0);
    for (int i = 0; i < 170; i++){
      float d = map(ro + rd*t);
      if (d < dMin) { dMin = d; pMin = ro + rd*t; }
      if (d < 0.0005) { tHit = t; break; }
      t += d;
      if (t > bs.y) break;
    }
  }
  if (tHit < 1e8){
    vec3 p = ro + rd*tHit;
    float rib, cw;
    mapScene(p, rib, cw);
    float ow = 1.0 - cw;                            // 1 on the ordered core, 0 on chaotic children
    vec3 n = calcNormal(p);
    float cosi = clamp(dot(-rd, n), 0.0, 1.0);
    float fres = 0.05 + 0.95*pow(1.0 - cosi, 4.0);
    vec3 rdir = reflect(rd, n);
    vec3 irid = film(2.2*(1.0 - cosi) + rib*0.45*ow + dot(n, vec3(0.4, 0.3, 0.2)) + PH/TAU + cw*0.35);
    vec3 refl = env(rdir, 1.0) * mix(vec3(1.0), irid, 0.75);

    // through the glass to the back surface
    vec3 d1 = refract(rd, n, 1.0/IOR);
    vec3 pi = p - n*0.004;
    float ti = 0.01;
    for (int i = 0; i < 56; i++){
      float d = -map(pi + d1*ti);
      if (d < 0.0006) break;
      ti += max(d, 0.004);
    }
    vec3 pe = pi + d1*ti;
    vec3 ne = calcNormal(pe);
    vec3 tr;
    vec3 iors = vec3(IOR - 0.05, IOR, IOR + 0.06);
    for (int k = 0; k < 3; k++){
      vec3 d2 = refract(d1, -ne, iors[k]);
      if (dot(d2, d2) < 0.5) d2 = reflect(d1, -ne);
      tr[k] = env(d2, 1.0)[k];
    }
    tr *= mix(vec3(1.0), film(rib*0.6*ow + ti*0.9 - PH/TAU), 0.45);

    // sun core: a hot mass glowing through the glass, strongest where the inner ray passes the centre
    float tcI = clamp(-dot(pi, d1), 0.0, ti);
    float coreD = length(pi + d1*tcI);
    float heat = (0.75 + 0.35*PULSE) * (0.9 + 0.1*sin(PH*3.0));
    vec3 core = mix(vec3(1.0, 0.32, 0.22), vec3(1.0, 0.85, 0.75), exp(-coreD*coreD*14.0)) * exp(-coreD*coreD*7.0) * 0.28 * heat;
    tr += core * ow + core * cw * 0.25;

    vec3 inner = haloCol(atan(p.y, p.x)) * (0.04 + 0.12*pow(1.0 - cosi, 2.0)) * (0.8 + 0.4*PULSE);
    col = mix(tr*0.9, refl, fres) + refl*0.08 + inner;
    col *= 1.0 - 0.55*ow*exp(-pow(abs((ORB*p).y), 2.0)*260.0);      // seam reads dark
    col += vec3(1.0, 0.95, 1.0) * ow * (1.0 - exp(-pow((ORB*p).y, 2.0)*300.0)) * pow(rib, 24.0) * pow(max(dot(rdir, normalize(vec3(-0.75, 0.85, 0.55))), 0.0), 6.0) * 1.2;
  }

  // --- corona around the core (analytic, from the ray's closest approach) ---
  float tc = -dot(ro, rd);
  vec3 cp = ro + rd*tc;
  float dist = length(cp);
  float edge = max(dist - 0.97, 0.0);
  float inside = smoothstep(0.86, 1.0, dist);
  float a = atan(cp.y, cp.x);
  vec3 hc = haloCol(a);
  float flare = 0.5 + 0.5*sin(a*5.0 + PH*2.0)*sin(a*3.0 - PH*3.0 + 1.0);
  float g = exp(-edge*mix(4.2, 2.2, flare))*0.16 * inside * (0.85 + 0.3*PULSE);
  col += hc * g;
  // tight rim light that hugs the real outline (core + budding children), only on rays that miss
  if (tHit > 1e8 && dMin < 1.0){
    float rim = exp(-max(dMin, 0.0)*85.0) * 0.7 * (0.85 + 0.3*PULSE);
    col += haloCol(atan(pMin.y, pMin.x)) * rim;
  }
  col += vec3(0.6, 0.30, 0.40) * exp(-edge*1.8) * 0.014;

  // --- soft glow around each child once it has left the core ---
  for (int i = 0; i < NC; i++){
    vec3 oc = CC[i].xyz - ro;
    float tt = dot(oc, rd);
    if (tt <= 0.0) continue;
    float e = max(length(oc - rd*tt) - CC[i].w, 0.0);
    float out_ = smoothstep(1.05, 1.4, length(CC[i].xyz));
    vec3 gc = mix(vec3(0.85, 0.75, 1.0), film(float(i)*0.13 + PH/TAU), 0.6);
    col += gc * exp(-e*16.0) * 0.07 * CA[i].y * out_;
  }

  // --- grade ---
  col = max(col, 0.0) * 0.9;
  col = (col*(2.51*col + 0.03)) / (col*(2.43*col + 0.59) + 0.14);   // ACES fit
  col = pow(col, vec3(1.0/2.2));
  col *= 1.0 - 0.35*pow(rr*0.9, 2.2);                             // vignette
  // --- film grain: one value per output pixel, new pattern every frame ---
  vec2 gp = floor(gl_FragCoord.xy / uGrainPx);
  float fr = floor(uTime*30.0 + 0.5);
  vec2 seed = vec2(mod(fr*73.0, 1031.0), mod(fr*151.0, 977.0));
  float n = hash12(gp + seed) + hash12(gp*1.37 + seed.yx + 19.2) - 1.0;       // soft, film-like (-1..1)
  vec3 nc = vec3(hash12(gp + seed + 5.1), hash12(gp + seed + 9.7), hash12(gp + seed + 13.3)) - 0.5;
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  float amt = uGrain * (0.65 + 0.7*(1.0 - abs(lum*2.0 - 1.0)));               // strongest in midtones
  amt *= 0.35 + 0.65*smoothstep(0.02, 0.16, lum);                            // keep blacks black
  col += amt * (n*0.85 + nc*0.30);
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script type="module">
const LOOP = 30, FPS = 30, FRAMES = LOOP * FPS;
const qs = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const hud = document.getElementById('hud');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });

const log = (msg) => { console.log(msg); fetch('/log', { method: 'POST', body: String(msg) }).catch(() => {}); };

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const VERT = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
function program(fragSrc) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.bindAttribLocation(pr, 0, 'p');
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  return pr;
}
const prog = program(document.getElementById('frag').textContent);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uGrain = gl.getUniformLocation(prog, 'uGrain');
const uGrainPx = gl.getUniformLocation(prog, 'uGrainPx');
const GRAIN = +(qs.get('grain') ?? 0.07), GRAIN_SIZE = +(qs.get('grainsize') || 1);

function setSize(w, h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
function draw(t, w = canvas.width, h = canvas.height, grainPx = GRAIN_SIZE) {
  gl.useProgram(prog); gl.uniform2f(uRes, w, h); gl.uniform1f(uTime, t);
  gl.uniform1f(uGrain, GRAIN); gl.uniform1f(uGrainPx, grainPx); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// Offline rendering: draw at SS× into an offscreen texture, box-downsample on the GPU,
// then readPixels. readPixels is synchronous, so every frame is guaranteed to be the
// one just drawn (copying the visible canvas can hand back a stale frame in a tight loop).
const OUT_W = +(qs.get('w') || 1920), OUT_H = Math.round(OUT_W * 9 / 16), SS = +(qs.get('ss') || 2);
let off = null;
function initOffline() {
  setSize(OUT_W, OUT_H);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, OUT_W * SS, OUT_H * SS);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  // output row r (bottom-up in GL) = image row r from the top, so readPixels comes out top-down
  const down = program(`#version 300 es
precision highp float;
uniform sampler2D src; uniform int ss; uniform int outH; out vec4 o;
void main(){
  ivec2 px = ivec2(gl_FragCoord.xy);
  int sy = outH - 1 - px.y;
  vec3 acc = vec3(0.0);
  for (int y = 0; y < ss; y++) for (int x = 0; x < ss; x++)
    acc += texelFetch(src, ivec2(px.x*ss + x, sy*ss + y), 0).rgb;
  o = vec4(acc / float(ss*ss), 1.0);
}`);
  gl.useProgram(down);
  gl.uniform1i(gl.getUniformLocation(down, 'src'), 0);
  gl.uniform1i(gl.getUniformLocation(down, 'ss'), SS);
  gl.uniform1i(gl.getUniformLocation(down, 'outH'), OUT_H);
  off = { tex, fbo, down, pixels: new Uint8Array(OUT_W * OUT_H * 4) };
}
function renderFrame(t) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, off.fbo);
  gl.viewport(0, 0, OUT_W * SS, OUT_H * SS);
  draw(t, OUT_W * SS, OUT_H * SS, SS * GRAIN_SIZE);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, OUT_W, OUT_H);
  gl.useProgram(off.down);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, off.tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, OUT_W, OUT_H, gl.RGBA, gl.UNSIGNED_BYTE, off.pixels);
  return off.pixels;
}
const checksum = px => { let h = 0; for (let i = 0; i < px.length; i += 4099) h = (h * 31 + px[i]) >>> 0; return h.toString(16); };

async function stills() {
  initOffline();
  const out = document.createElement('canvas'); out.width = OUT_W; out.height = OUT_H;
  const ctx = out.getContext('2d');
  log('renderer: ' + (gl.getExtension('WEBGL_debug_renderer_info') ? gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL) : '?'));
  for (const t of qs.get('still').split(',').map(Number)) {
    const t0 = performance.now();
    ctx.putImageData(new ImageData(new Uint8ClampedArray(renderFrame(t)), OUT_W, OUT_H), 0, 0);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    await fetch('/save?name=' + encodeURIComponent(`still-${t.toFixed(2)}.png`), { method: 'POST', body: blob });
    log(`still t=${t} ${(performance.now() - t0).toFixed(0)}ms`);
  }
  await fetch('/done', { method: 'POST' });
}

// One render pass can feed several encoders, e.g. &mbps=40,14&name=master.mp4,web.mp4
async function renderVideo() {
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.mjs');
  initOffline();
  const rates = (qs.get('mbps') || '24').split(',').map(Number);
  const names = (qs.get('name') || 'prism-orb-30s.mp4').split(',');
  let encErr = null;
  const outs = [];
  for (let j = 0; j < rates.length; j++) {
    let config = null;
    for (const codec of ['avc1.640033', 'avc1.640032', 'avc1.640028', 'avc1.4d0033']) {
      const c = { codec, width: OUT_W, height: OUT_H, bitrate: rates[j] * 1e6, framerate: FPS, bitrateMode: 'variable', latencyMode: 'quality', avc: { format: 'avc' } };
      if ((await VideoEncoder.isConfigSupported(c)).supported) { config = c; break; }
    }
    if (!config) { log('ERROR: no supported H.264 config'); await fetch('/done', { method: 'POST' }); return; }
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({ target, video: { codec: 'avc', width: OUT_W, height: OUT_H, frameRate: FPS }, fastStart: 'in-memory' });
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; log('ERROR ' + e); } });
    enc.configure(config);
    outs.push({ target, muxer, enc, name: names[j] || `out-${rates[j]}mbps.mp4` });
    log(`encoder ${j}: ${config.codec} ${OUT_W}x${OUT_H} @${rates[j]}Mbps -> ${outs[j].name}`);
  }

  const t0 = performance.now();
  for (let i = 0; i < FRAMES; i++) {
    const px = renderFrame(i / FPS);
    const vf = new VideoFrame(px, { format: 'RGBA', codedWidth: OUT_W, codedHeight: OUT_H, timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    for (const o of outs) o.enc.encode(vf, { keyFrame: i % (FPS * 2) === 0 });
    vf.close();
    while (outs.some(o => o.enc.encodeQueueSize > 6)) await new Promise(r => setTimeout(r, 5));
    if (encErr) break;
    if (i % 150 === 0) log(`frame ${i}/${FRAMES}  ${((performance.now() - t0) / 1000).toFixed(1)}s  checksum ${checksum(px)}`);
  }
  for (const o of outs) {
    await o.enc.flush();
    o.muxer.finalize();
    await fetch('/save?name=' + encodeURIComponent(o.name), { method: 'POST', body: o.target.buffer });
    log(`saved ${o.name} ${(o.target.buffer.byteLength / 1e6).toFixed(1)}MB`);
  }
  log(`done in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
  await fetch('/done', { method: 'POST' });
}

function live() {
  const fixed = qs.has('t') ? +qs.get('t') : null;
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, +(qs.get('dpr') || 1.5));   // ?dpr= caps live resolution (lighter on phones)
    setSize(Math.round(innerWidth * dpr), Math.round(innerHeight * dpr));
  };
  addEventListener('resize', resize); resize();
  const start = performance.now();
  const tick = () => {
    const t = fixed ?? ((performance.now() - start) / 1000) % LOOP;
    draw(t);
    if (qs.has('hud')) hud.textContent = t.toFixed(2) + 's';
    requestAnimationFrame(tick);
  };
  tick();
}

if (qs.has('render')) renderVideo().catch(e => log('ERROR ' + e.stack));
else if (qs.has('still')) stills().catch(e => log('ERROR ' + e.stack));
else live();
</script>
</body>
